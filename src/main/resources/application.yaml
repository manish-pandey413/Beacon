spring:
  application:
    name: webhook

  datasource:
    url: jdbc:postgresql://localhost:5432/webhook_platform
    username: hp
    password: password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000

app:
  outbox:
    poll-interval-ms: 1000
    batch-size: 25
    lease-seconds: 120

server:
  port: 8080

security:
  webhook:
    encryption-key: ${WEBHOOK_ENCRYPTION_KEY}
